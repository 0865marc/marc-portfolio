schema_version: 2
project:
  name: marc-portfolio
  root: .
  environment: production
  default_branch: main
  public_target: portfolio.mybrawl.io
identity:
  source: package.json
  package_name: marc-portfolio
source_of_truth:
  application:
    - package.json
    - astro.config.mjs
    - src
    - tailwind.config.js
    - tsconfig.json
  operations:
    - Dockerfile
    - .github/workflows/ci.yml
    - ops/ci-candidates.md
    - ops/nginx/container.conf
  curated_knowledge:
    - .agents/README.md
    - .agents/DESIGN.md
    - .agents/context
    - .agents/domains
    - .agents/decisions
    - .agents/tasks
boundaries:
  application_source_wins_over_curated_summaries: true
review:
  protocol: .agents/tasks/README.md
  template: .agents/tasks/knowledge-delta.template.yaml
  independent_review_required: true
