    - path: "src/index.css"
      fact: "All routes opt in to native cross-document View Transitions: the page crossfade lasts 180ms and shared groups animate for 260ms. Reduced-motion mode opts out and disables transition animations. No-script browsing and unsupported browsers keep standard document navigation without transitions."
      evidence: "src/index.css; tests/e2e/site.spec.ts: project navigation completes native transitions and respects reduced motion"
    - path: "src/components/ProjectBrand.astro"
      fact: "Each project logo has a stable, unique view-transition-name shared between its home card and project page. Existing paths, colors, dimensions and typography remain unchanged."
      evidence: "src/components/ProjectBrand.astro; src/components/ProjectsSection.astro; src/pages/proyectos/ainkii.astro; src/pages/proyectos/butipunt.astro"
  changed_nodes:
