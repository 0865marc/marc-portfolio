      fact: "The header back link returns to /#projects, matching ButiPunt and preserving the project-section position and existing hash focus behavior."
      evidence: "src/pages/proyectos/ainkii.astro; src/scripts/navigation.ts; tests/e2e/site.spec.ts"
    - path: "src/scripts/navigation.ts"
      fact: "Initial fragment focus runs after pageshow so native navigation cannot reset it. Cached history entries preserve browser-restored position and focus; same-document hash changes retain their existing behavior."
      evidence: "src/scripts/navigation.ts; tests/e2e/site.spec.ts"
