server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    set $cache_policy "public, max-age=3600";

    add_header Cache-Control $cache_policy always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self'; font-src 'self'; form-action 'none'; frame-ancestors 'none'; img-src 'self' data:; object-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; upgrade-insecure-requests" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=(), usb=()" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_vary on;
    gzip_types application/javascript application/json application/xml image/svg+xml text/css text/plain;

    location /assets/ {
        set $cache_policy "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        set $cache_policy "no-cache";
        try_files $uri =404;
    }

    location = /blog/arquitecturas-plataformas-iot/ {
        return 308 /blog/;
    }

    location = /blog/rabbitmq-celery-procesos-pesados/ {
        return 308 /blog/;
    }

    location = /blog/infraestructura-distribuida-latencia/ {
        return 308 /blog/;
    }

    location ~ \.html$ {
        set $cache_policy "no-cache";
        try_files $uri =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
        set $cache_policy "no-cache";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
